name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build web (typecheck + vite build)
        run: npm run build:web
      - name: Web test layout check
        run: npm run check:web:test-layout
      - name: Spec trace
        id: spec_trace
        run: npm run spec:trace
      - name: Verify spec coverage
        run: npm run spec:verify
      - name: Upload spec verification matrix
        if: always() && steps.spec_trace.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: spec-verification-matrix
          path: artifacts/spec-trace/**
          if-no-files-found: error
          overwrite: true
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium
      - name: Web E2E tests (Playwright)
        run: npm run test:web:e2e
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore

  validate-example-datasets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout graphdown
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Compile core for validation
        run: npx tsc -p packages/core/tsconfig.json --outDir dist/core --module CommonJS --moduleResolution Node
      - name: Validate research-lab-dataset (JSON)
        run: |
          set -euo pipefail
          rm -rf /tmp/research-lab-dataset
          git clone --depth 1 https://github.com/johnbenac/research-lab-dataset.git /tmp/research-lab-dataset
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { validateDatasetSnapshot } = require('./dist/core');

          function loadRepoSnapshotFromFs(root) {
            const files = new Map();
            const walk = (dir) => {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                if (entry.name === '.git') continue;
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  walk(full);
                } else if (entry.isFile()) {
                  const rel = path.relative(root, full).split(path.sep).join('/');
                  files.set(rel, fs.readFileSync(full));
                }
              }
            };
            walk(root);
            return { files };
          }

          const snapshot = loadRepoSnapshotFromFs('/tmp/research-lab-dataset');
          const result = validateDatasetSnapshot(snapshot);
          if (!result.ok) {
            console.error(JSON.stringify(result, null, 2));
            process.exit(1);
          }
          console.log('research-lab-dataset: ok');
          NODE
      - name: Validate product-tracker-dataset (JSON)
        run: |
          set -euo pipefail
          rm -rf /tmp/product-tracker-dataset
          git clone --depth 1 https://github.com/johnbenac/product-tracker-dataset.git /tmp/product-tracker-dataset
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { validateDatasetSnapshot } = require('./dist/core');

          function loadRepoSnapshotFromFs(root) {
            const files = new Map();
            const walk = (dir) => {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                if (entry.name === '.git') continue;
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  walk(full);
                } else if (entry.isFile()) {
                  const rel = path.relative(root, full).split(path.sep).join('/');
                  files.set(rel, fs.readFileSync(full));
                }
              }
            };
            walk(root);
            return { files };
          }

          const snapshot = loadRepoSnapshotFromFs('/tmp/product-tracker-dataset');
          const result = validateDatasetSnapshot(snapshot);
          if (!result.ok) {
            console.error(JSON.stringify(result, null, 2));
            process.exit(1);
          }
          console.log('product-tracker-dataset: ok');
          NODE
