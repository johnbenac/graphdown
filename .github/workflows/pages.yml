name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Deploy even if no deploy-relevant files changed"
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  changes:
    name: Determine whether this commit should deploy
    runs-on: ubuntu-latest
    outputs:
      deploy_web: ${{ steps.filter.outputs.deploy_web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ensure git history exists for paths-filter diffing

      # Uses GitHub's diff; avoids brittle git-fetch edge cases on merges/force-pushes.
      - name: Decide if web deployment is needed
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # GITHUB_TOKEN is fine here; it's read-only diffing.
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            deploy_web:
              # --- Web production inputs ---
              - "apps/web/src/**"
              - "apps/web/index.html"
              - "apps/web/src/styles.css"
              - "apps/web/vite.config.*"
              - "apps/web/tsconfig*.json"
              - "apps/web/package.json"

              # --- Shared runtime code that can affect the bundle ---
              - "packages/core/src/**"
              - "packages/core/package.json"
              - "packages/io/src/**"
              - "packages/io/package.json"
              - "packages/io-zip/src/**"
              - "packages/io-zip/package.json"
              - "packages/runtime/src/**"
              - "packages/runtime/package.json"

              # --- Root build inputs that can affect output ---
              - "package.json"
              - "package-lock.json"
              - "tsconfig.json"

              # --- Explicit NON-deploy changes (tests, docs, CI, etc.) ---
              - "!apps/web/e2e/**"
              - "!apps/web/**/__tests__/**"
              - "!apps/web/test-results/**"
              - "!packages/core/**/__tests__/**"
              - "!.github/**"
              - "!docs/**"
              - "!artifacts/**"

      - name: Summarize decision
        run: |
          echo "deploy_web=${{ steps.filter.outputs.deploy_web }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Manual override: workflow_dispatch input force_deploy" >> $GITHUB_STEP_SUMMARY

  build:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.deploy_web == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_deploy)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5
        id: pages

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm --workspace apps/web run build
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}

      - name: Disable Jekyll
        run: touch apps/web/dist/.nojekyll

      - name: SPA fallback (404 -> index.html)
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.deploy_web == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_deploy)

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
